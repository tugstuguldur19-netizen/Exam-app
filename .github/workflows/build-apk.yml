name: Build Android APK

# GitHub's hosted runners have full internet access and a preinstalled
# Android SDK, so this builds the APK here rather than anywhere sandboxed —
# no Expo/EAS account or local Android SDK setup needed.
on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: >
          Backend URL the built app will call (baked in at build time — the
          app can't be pointed elsewhere after this). Must be reachable from
          the phone, so a deployed backend, or your computer's LAN IP with
          the phone on the same Wi-Fi — not localhost/10.0.2.2, which only
          resolve inside an emulator.
        required: false
        default: ""

# Avoids two runs landing close together and doing redundant work — not
# load-bearing for correctness (see the note by upload-artifact below for
# what that turned out to actually be about), just tidy.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Only set when this run came from workflow_dispatch with a value —
      # an empty string here would override config.ts's own fallback logic.
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a working Android SDK preinstalled (ANDROID_HOME
      # etc. already set) — no separate SDK setup action needed. Only ensure
      # licenses are accepted, since a runner-image update occasionally ships
      # with a newer SDK component whose license hasn't been pre-accepted.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK (arm64 only, minified)
        working-directory: mobile/android
        # A debug, all-ABI build of this app is ~160MB (147MB of that is
        # native .so libraries duplicated across armeabi-v7a/arm64-v8a/x86/
        # x86_64). arm64-v8a alone covers effectively every real Android
        # phone from the last ~8 years, and this app's own release build
        # type already points its signingConfig at the debug key (Expo's
        # default template), so this stays installable without a real
        # signing key — just not a Play-Store-distributable build.
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      # This is the reliable way to get the APK out of CI: it has succeeded
      # on every single run. (An earlier version of this workflow also
      # tried publishing a GitHub Release with the APK attached, as a
      # second retrieval path — both a hand-rolled `gh release` script and
      # the well-established softprops/action-gh-release silently failed to
      # attach the asset, on both solo and concurrent runs, while the
      # release object itself was created fine. Two independent mechanisms
      # failing the same way, plus an explicit 403 hit earlier trying to
      # delete a release ("not permitted for this session type"), points at
      # a policy restriction rather than a bug in either tool — dropped
      # rather than keep trying to route around it.)
      - uses: actions/upload-artifact@v4
        with:
          name: exam-prep-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
