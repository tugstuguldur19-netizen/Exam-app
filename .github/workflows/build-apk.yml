name: Build Android APK

# GitHub's hosted runners have full internet access and a preinstalled
# Android SDK, so this builds the APK here rather than anywhere sandboxed —
# no Expo/EAS account or local Android SDK setup needed.
on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: >
          Backend URL the built app will call (baked in at build time — the
          app can't be pointed elsewhere after this). Must be reachable from
          the phone, so a deployed backend, or your computer's LAN IP with
          the phone on the same Wi-Fi — not localhost/10.0.2.2, which only
          resolve inside an emulator.
        required: false
        default: ""

permissions:
  contents: write

# Two runs racing to create/upload releases on the same repo appears to be
# how run 6 and run 7 (a push-triggered run and a manual dispatch landing
# within seconds of each other) both finished green with the release
# object created but its APK asset silently missing. Serialize instead of
# letting runs overlap — a genuinely rare case, but a queued extra minute
# is cheap insurance against a repeat.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Only set when this run came from workflow_dispatch with a value —
      # an empty string here would override config.ts's own fallback logic.
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a working Android SDK preinstalled (ANDROID_HOME
      # etc. already set) — no separate SDK setup action needed. Only ensure
      # licenses are accepted, since a runner-image update occasionally ships
      # with a newer SDK component whose license hasn't been pre-accepted.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK (arm64 only, minified)
        working-directory: mobile/android
        # A debug, all-ABI build of this app is ~160MB (147MB of that is
        # native .so libraries duplicated across armeabi-v7a/arm64-v8a/x86/
        # x86_64). arm64-v8a alone covers effectively every real Android
        # phone from the last ~8 years, and this app's own release build
        # type already points its signingConfig at the debug key (Expo's
        # default template), so this stays installable without a real
        # signing key — just not a Play-Store-distributable build.
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - uses: actions/upload-artifact@v4
        with:
          name: exam-prep-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Actions artifacts are stored on Azure blob storage, which isn't
      # reachable everywhere GitHub itself is (some networks that allow
      # github.com block *.blob.core.windows.net) — a GitHub Release asset
      # is served from GitHub's own CDN instead, so it's a more universally
      # downloadable copy of the same APK.
      #
      # Hand-rolled `gh release create` + `gh release upload` repeatedly
      # reported success (including an explicit post-upload verification
      # step) while the asset silently never attached, across both solo and
      # concurrent runs. Switched to a well-established third-party action
      # built specifically for this, to isolate whether that was a `gh` CLI
      # issue or something failing regardless of mechanism.
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-run${{ github.run_number }}
          name: APK (run ${{ github.run_number }})
          body: Automated arm64 release build (debug-signed) from commit ${{ github.sha }}.
          # uses: steps don't inherit defaults.run.working-directory (mobile/)
          # — that only applies to run: steps — so this needs the full path.
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
